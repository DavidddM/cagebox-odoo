# GitHub fetch broker: the sandbox reaches GitHub only through this port.
# The proxy attaches the operator's token on the way out and refuses pushes,
# so no credential ever exists inside the sandbox.

http_port 3129 accel defaultsite=github.com no-vhost
cache_peer github.com parent 443 0 no-query originserver tls tls-domain=github.com forceddomain=github.com name=github

acl github_fetch localport 3129
acl git_push urlpath_regex -i git-receive-pack
acl git_lfs urlpath_regex -i /info/lfs/

http_access deny github_fetch git_push
http_access deny github_fetch git_lfs
http_access allow github_fetch localnet

cache_peer_access github allow github_fetch
cache_peer_access github deny all
never_direct allow github_fetch
always_direct allow !github_fetch
cache deny github_fetch

include /run/squid/github-auth.conf
